<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarNg'ara</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> <!-- this CDN allows us to use tailwind -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <!-- this CDN allows us to use font awesome icons -->
</head>

<body class="bg-gray-100">

  <!-- NAVBAR -->
  <header class="bg-white shadow p-4 flex justify-between">
    <div class="flex gap-4">
      <h2 class="mr-2 pt-2 font-bold  hover:text-blue-500 pr-5">Car Ng'ara</h2>
       <button class=" hover:text-blue-500 hover:font-bold" onclick="navigate('home')" class="mr-2">Home</button>  <!--navigates to home page by feeding agument home to navigate function -->
       <button class=" hover:text-blue-500 hover:font-bold"onclick="navigate('about')" class="mr-2">About</button> <!-- navigates to about page by feeding argument about to navigate function -->
      <button class=" hover:text-blue-500 hover:font-bold" onclick="navigate('contact')">Contact</button>  <!-- navigates to contact page by feeding argument contact to navigate function -->
    </div>

    <div id="nav-buttons">
      <button onclick="navigate('login')" class="mr-2 text-blue-600">Login</button> <!-- navigates to login page by feeding argument login to navigate function -->
      <button onclick="navigate('signup')" class="text-green-600">Sign Up</button>  <!-- navigates to signup page by feeding argument signup to navigate function -->
  </header>

  <!-- CONTENT AREA -->
  <main id="app" class="p-6"></main>  <!-- this is where the html will be inserted -->
    <script src="script.js"></script>  <!-- this links to our javascript file -->
</body>
</html>
